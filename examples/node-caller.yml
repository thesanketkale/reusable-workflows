name: 'Example: Node CI Caller'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  node-ci:
    name: 'Node CI Pipeline'
    uses: thesanketkale/reusable-workflows/.github/workflows/node-ci.yml@v1
    permissions:
      contents: read
    with:
      node-version: '20.x'
      package-manager: 'npm'
      working-directory: '.'
