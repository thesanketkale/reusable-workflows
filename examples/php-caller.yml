name: 'Example: PHP CI Caller'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

permissions: {}

jobs:
  php-ci:
    name: 'PHP CI Pipeline'
    uses: thesanketkale/reusable-workflows/.github/workflows/php-ci.yml@v1
    permissions:
      contents: read
    with:
      working-directory: '.'
      extensions: 'mbstring, xml, ctype, pdo, pdo_sqlite'
