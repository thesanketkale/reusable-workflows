version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/fixtures/node'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
