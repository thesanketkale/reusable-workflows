name: 'Self-Test: .NET CI'

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/dotnet-ci.yml'
      - '.github/workflows/selftest-dotnet.yml'
      - 'fixtures/dotnet/**'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/dotnet-ci.yml'
      - '.github/workflows/selftest-dotnet.yml'
      - 'fixtures/dotnet/**'
  workflow_dispatch:

concurrency:
  group: selftest-dotnet-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  call-dotnet-ci:
    name: 'Run .NET CI Self-Test'
    uses: ./.github/workflows/dotnet-ci.yml
    permissions:
      contents: read
    with:
      dotnet-version: '8.0.x'
      solution: 'fixtures/dotnet/SampleApp.sln'
      configuration: 'Release'
