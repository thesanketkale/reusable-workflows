name: 'Self-Test: Terraform Checks'

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/terraform-checks.yml'
      - '.github/workflows/selftest-terraform.yml'
      - 'fixtures/terraform/**'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/terraform-checks.yml'
      - '.github/workflows/selftest-terraform.yml'
      - 'fixtures/terraform/**'
  workflow_dispatch:

concurrency:
  group: selftest-terraform-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  call-terraform-checks:
    name: 'Run Terraform Checks Self-Test'
    uses: ./.github/workflows/terraform-checks.yml
    permissions:
      contents: read
    with:
      working-directory: 'fixtures/terraform'
      terraform-version: '1.9.0'
      use-opentofu: false
