name: 'Self-Test: Node CI'

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/node-ci.yml'
      - '.github/workflows/selftest-node.yml'
      - 'fixtures/node/**'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/node-ci.yml'
      - '.github/workflows/selftest-node.yml'
      - 'fixtures/node/**'
  workflow_dispatch:

concurrency:
  group: selftest-node-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  call-node-ci:
    name: 'Run Node CI Self-Test'
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      node-version: '20.x'
      package-manager: 'npm'
      working-directory: 'fixtures/node'
