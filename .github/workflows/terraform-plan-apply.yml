name: 'Reusable Terraform Plan & Apply'

on:
  workflow_call:
    inputs:
      cloud:
        description: 'Target cloud platform ("aws" or "azure")'
        type: string
        required: true
      working-directory:
        description: 'Directory containing Terraform/OpenTofu files'
        type: string
        required: false
        default: '.'
      terraform-version:
        description: 'Terraform or OpenTofu CLI version to install'
        type: string
        required: false
        default: '1.9.0'
      use-opentofu:
        description: 'Whether to use OpenTofu instead of HashiCorp Terraform'
        type: boolean
        required: false
        default: false
      environment:
        description: 'Target GitHub Environment for apply phase approvals'
        type: string
        required: false
        default: 'production'
      aws-role-to-assume:
        description: 'AWS IAM Role ARN for OIDC authentication'
        type: string
        required: false
        default: ''
      aws-region:
        description: 'AWS target region'
        type: string
        required: false
        default: 'us-east-1'
      azure-client-id:
        description: 'Azure Entra ID client ID for OIDC'
        type: string
        required: false
        default: ''
      azure-tenant-id:
        description: 'Azure Entra ID tenant ID'
        type: string
        required: false
        default: ''
      azure-subscription-id:
        description: 'Azure Subscription ID'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  plan:
    name: 'Terraform Plan (${{ inputs.cloud }})'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
      id-token: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu CLI
        if: inputs.use-opentofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.terraform-version }}

      - name: Setup Terraform CLI
        if: ${{ !inputs.use-opentofu }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Authenticate to AWS via OIDC
        if: inputs.cloud == 'aws' && inputs.aws-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          audience: 'sts.amazonaws.com'

      - name: Authenticate to Azure via OIDC
        if: inputs.cloud == 'azure' && inputs.azure-client-id != ''
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Initialize Terraform
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then CMD="tofu"; fi
          $CMD init

      - name: Generate Terraform Plan
        id: plan
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then CMD="tofu"; fi
          $CMD plan -no-color -out=tfplan > plan_output.txt
          cat plan_output.txt

      - name: Upload execution plan artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ inputs.cloud }}-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}/tfplan
          retention-days: 7

      - name: Post or update sticky PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const planPath = path.join('${{ inputs.working-directory }}', 'plan_output.txt');
            let planText = 'Plan output unavailable.';
            if (fs.existsSync(planPath)) {
              planText = fs.readFileSync(planPath, 'utf8');
            }
            if (planText.length > 60000) {
              planText = planText.substring(0, 60000) + '\n... [truncated]';
            }

            const header = `#### Terraform Plan: \`${{ inputs.cloud }}\` (\`${{ inputs.environment }}\`)`;
            const body = `${header}\n\n<details><summary>Show Plan Output</summary>\n\n\`\`\`hcl\n${planText}\n\`\`\`\n\n</details>\n\n*Pushed by @${context.actor} at ${new Date().toISOString()}*`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user && c.user.type === 'Bot' && c.body && c.body.includes(header));
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

  apply:
    name: 'Terraform Apply (${{ inputs.cloud }})'
    needs: plan
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu CLI
        if: inputs.use-opentofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.terraform-version }}

      - name: Setup Terraform CLI
        if: ${{ !inputs.use-opentofu }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Authenticate to AWS via OIDC
        if: inputs.cloud == 'aws' && inputs.aws-role-to-assume != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws-role-to-assume }}
          aws-region: ${{ inputs.aws-region }}
          audience: 'sts.amazonaws.com'

      - name: Authenticate to Azure via OIDC
        if: inputs.cloud == 'azure' && inputs.azure-client-id != ''
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ inputs.azure-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Download plan artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tfplan-${{ inputs.cloud }}-${{ inputs.environment }}
          path: ${{ inputs.working-directory }}

      - name: Initialize Terraform
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then CMD="tofu"; fi
          $CMD init

      - name: Apply infrastructure changes
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then CMD="tofu"; fi
          $CMD apply -auto-approve tfplan
