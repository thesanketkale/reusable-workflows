name: 'CI: Repository Quality & Governance'

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  static-analysis:
    name: 'Actionlint, Yamllint & Shellcheck'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Install yamllint and shellcheck
        shell: bash
        run: |
          pip install --no-cache-dir yamllint pyyaml
          sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Download actionlint binary
        shell: bash
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          sudo mv ./actionlint /usr/local/bin/

      - name: Run actionlint
        shell: bash
        run: |
          actionlint -color

      - name: Run yamllint
        shell: bash
        run: |
          yamllint -c .yamllint.yml .

      - name: Run shellcheck on shell scripts
        shell: bash
        run: |
          files=$(find . -name "*.sh" -not -path "*/.*" 2>/dev/null)
          if [ -n "$files" ]; then
            # shellcheck disable=SC2086
            shellcheck $files
          fi

      - name: Validate documentation input contracts
        shell: bash
        run: |
          bash scripts/check-docs.sh

  selftest-dotnet:
    name: 'Self-Test: .NET CI'
    needs: static-analysis
    uses: ./.github/workflows/dotnet-ci.yml
    permissions:
      contents: read
    with:
      dotnet-version: '8.0.x'
      solution: 'fixtures/dotnet/SampleApp.sln'
      configuration: 'Release'

  selftest-node:
    name: 'Self-Test: Node CI'
    needs: static-analysis
    uses: ./.github/workflows/node-ci.yml
    permissions:
      contents: read
    with:
      node-version: '20.x'
      package-manager: 'npm'
      working-directory: 'fixtures/node'

  selftest-php:
    name: 'Self-Test: PHP CI'
    needs: static-analysis
    uses: ./.github/workflows/php-ci.yml
    permissions:
      contents: read
    with:
      working-directory: 'fixtures/php'
      extensions: 'mbstring, xml, ctype, pdo, pdo_sqlite'

  selftest-docker:
    name: 'Self-Test: Docker Publish'
    needs: static-analysis
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image-name: 'ghcr.io/thesanketkale/fixture-image'
      dockerfile: 'fixtures/docker/Dockerfile'
      context: 'fixtures/docker'
      push: false
      platforms: 'linux/amd64'

  selftest-terraform:
    name: 'Self-Test: Terraform Checks'
    needs: static-analysis
    uses: ./.github/workflows/terraform-checks.yml
    permissions:
      contents: read
    with:
      working-directory: 'fixtures/terraform'
      terraform-version: '1.9.0'
      use-opentofu: false

  selftest-failure-propagation:
    name: 'Self-Test: Failure Propagation'
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005cbab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Verify deliberate fixture failure propagates non-zero exit code
        shell: bash
        run: |
          echo "Executing failing fixture (expecting non-zero exit code)..."
          if dotnet test fixtures/dotnet-failing/FailingApp.sln --configuration Release; then
            echo "ERROR: Expected failing fixture to fail, but it exited with 0!"
            exit 1
          else
            echo "SUCCESS: Deliberate fixture failure returned non-zero exit code as expected."
            exit 0
          fi
