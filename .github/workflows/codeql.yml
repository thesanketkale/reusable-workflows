name: 'Reusable CodeQL Analysis'

on:
  workflow_call:
    inputs:
      language:
        description: 'Programming language to analyze (e.g. "csharp", "javascript-typescript", "python", "actions")'
        type: string
        required: true
      build-mode:
        description: 'CodeQL build mode ("none", "autobuild", "manual")'
        type: string
        required: false
        default: 'none'

permissions: {}

jobs:
  analyze:
    name: 'CodeQL Security Scan (${{ inputs.language }})'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL scanner
        uses: github/codeql-action/init@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@4c50b6f6fd9dc6fe03111c2d045c8be2a724cce1 # v3.28.11
        with:
          category: '/language:${{ inputs.language }}'

      - name: Summarize CodeQL execution
        if: always()
        shell: bash
        run: |
          {
            echo "### CodeQL Static Analysis"
            echo "- **Language:** \`${{ inputs.language }}\`"
            echo "- **Build Mode:** \`${{ inputs.build-mode }}\`"
            echo "- **Status:** Completed scanning."
          } >> "$GITHUB_STEP_SUMMARY"
