name: 'Reusable .NET CI'

on:
  workflow_call:
    inputs:
      dotnet-version:
        description: 'Target .NET SDK version (e.g. "8.0.x", "9.0.x")'
        type: string
        required: false
        default: '8.0.x'
      solution:
        description: 'Path or glob to solution or project file'
        type: string
        required: false
        default: '**/*.sln'
      configuration:
        description: 'Build configuration ("Debug" or "Release")'
        type: string
        required: false
        default: 'Release'
      test-filter:
        description: 'Optional TestCaseFilter expression for dotnet test'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  build-and-test:
    name: '.NET Build & Test'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        shell: bash
        run: |
          dotnet restore ${{ inputs.solution }}

      - name: Build solution
        shell: bash
        run: |
          dotnet build ${{ inputs.solution }} --no-restore --configuration ${{ inputs.configuration }}

      - name: Verify code formatting
        shell: bash
        run: |
          dotnet format ${{ inputs.solution }} --verify-no-changes --no-restore

      - name: Run automated tests with coverage
        shell: bash
        run: |
          FILTER_ARGS=()
          if [ -n "${{ inputs.test-filter }}" ]; then
            FILTER_ARGS=(--filter "${{ inputs.test-filter }}")
          fi
          dotnet test ${{ inputs.solution }} \
            --no-build \
            --configuration ${{ inputs.configuration }} \
            --collect:"XPlat Code Coverage" \
            --results-directory TestResults \
            "${FILTER_ARGS[@]}"

      - name: Upload code coverage results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dotnet-coverage-results
          path: TestResults/
          if-no-files-found: ignore

      - name: Summarize test execution
        if: always()
        shell: bash
        run: |
          {
            echo "### .NET CI Summary"
            echo "- **SDK Version:** \`${{ inputs.dotnet-version }}\`"
            echo "- **Configuration:** \`${{ inputs.configuration }}\`"
            echo "- **Solution:** \`${{ inputs.solution }}\`"
            echo "- **Status:** Build and test run completed successfully."
          } >> "$GITHUB_STEP_SUMMARY"
