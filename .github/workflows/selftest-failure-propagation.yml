name: 'Self-Test: Failure Propagation'

on:
  push:
    branches: ['main']
    paths:
      - '.github/workflows/dotnet-ci.yml'
      - '.github/workflows/selftest-failure-propagation.yml'
      - 'fixtures/dotnet-failing/**'
  pull_request:
    branches: ['main']
    paths:
      - '.github/workflows/dotnet-ci.yml'
      - '.github/workflows/selftest-failure-propagation.yml'
      - 'fixtures/dotnet-failing/**'
  workflow_dispatch:

concurrency:
  group: selftest-failure-propagation-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions: {}

jobs:
  expected-failure:
    name: 'Run Deliberately Failing Fixture'
    uses: ./.github/workflows/dotnet-ci.yml
    permissions:
      contents: read
    with:
      dotnet-version: '8.0.x'
      solution: 'fixtures/dotnet-failing/FailingApp.sln'
      configuration: 'Release'

  verify-failure-propagated:
    name: 'Verify Failure Propagated Successfully'
    needs: expected-failure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Assert upstream job failed
        shell: bash
        run: |
          UPSTREAM_RESULT="${{ needs.expected-failure.result }}"
          echo "Observed upstream result: $UPSTREAM_RESULT"
          if [ "$UPSTREAM_RESULT" = "failure" ]; then
            echo "SUCCESS: Deliberate fixture failure was successfully propagated to caller."
            exit 0
          else
            echo "ERROR: Expected upstream reusable workflow to fail, but it reported: $UPSTREAM_RESULT"
            exit 1
          fi
