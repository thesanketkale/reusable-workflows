name: 'Reusable Terraform Checks'

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Directory containing Terraform/OpenTofu files'
        type: string
        required: false
        default: '.'
      terraform-version:
        description: 'Terraform or OpenTofu CLI version to install'
        type: string
        required: false
        default: '1.9.0'
      use-opentofu:
        description: 'Whether to use OpenTofu instead of HashiCorp Terraform'
        type: boolean
        required: false
        default: false
      tflint-version:
        description: 'TFLint release version'
        type: string
        required: false
        default: 'v0.53.0'
      checkov-args:
        description: 'Additional command line arguments passed to checkov'
        type: string
        required: false
        default: ''

permissions: {}

jobs:
  static-checks:
    name: 'Terraform Static Checks'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup OpenTofu CLI
        if: inputs.use-opentofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.terraform-version }}

      - name: Setup Terraform CLI
        if: ${{ !inputs.use-opentofu }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}

      - name: Check code formatting
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then
            CMD="tofu"
          fi
          echo "Checking formatting using $CMD fmt -check -recursive..."
          $CMD fmt -check -recursive

      - name: Initialize configuration without backend
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then
            CMD="tofu"
          fi
          echo "Initializing $CMD with backend=false..."
          $CMD init -backend=false

      - name: Validate configuration syntax
        shell: bash
        run: |
          CMD="terraform"
          if [ "${{ inputs.use-opentofu }}" = "true" ]; then
            CMD="tofu"
          fi
          echo "Validating syntax with $CMD validate..."
          $CMD validate

      - name: Run TFLint linter
        shell: bash
        run: |
          tflint --init || true
          tflint --recursive

      - name: Setup Python for Checkov
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run Checkov security scan
        shell: bash
        run: |
          pip install --no-cache-dir checkov
          CHECKOV_EXTRA="${{ inputs.checkov-args }}"
          # shellcheck disable=SC2086
          checkov -d . --framework terraform --compact --quiet $CHECKOV_EXTRA

      - name: Summarize Terraform Checks
        if: always()
        shell: bash
        run: |
          {
            echo "### Terraform Static Checks Summary"
            echo "- **Engine:** \`${{ inputs.use-opentofu && 'OpenTofu' || 'Terraform' }}\` (\`${{ inputs.terraform-version }}\`)"
            echo "- **Directory:** \`${{ inputs.working-directory }}\`"
            echo "- **TFLint & Checkov:** Executed without credentials."
          } >> "$GITHUB_STEP_SUMMARY"
