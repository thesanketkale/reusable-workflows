name: 'Reusable Gitleaks Scan'

on:
  workflow_call:
    inputs:
      config-path:
        description: 'Path to gitleaks configuration file'
        type: string
        required: false
        default: '.gitleaks.toml'
      fetch-depth:
        description: 'Git history fetch depth (0 for full history scan)'
        type: number
        required: false
        default: 0

permissions: {}

jobs:
  scan:
    name: 'Gitleaks Secret Scan'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.fetch-depth }}

      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: ${{ inputs.config-path }}

      - name: Summarize Gitleaks Scan
        if: always()
        shell: bash
        run: |
          {
            echo "### Gitleaks Secret Scan Summary"
            echo "- **Config Path:** \`${{ inputs.config-path }}\`"
            echo "- **Fetch Depth:** \`${{ inputs.fetch-depth }}\`"
            echo "- **Status:** Completed scanning repository history."
          } >> "$GITHUB_STEP_SUMMARY"
