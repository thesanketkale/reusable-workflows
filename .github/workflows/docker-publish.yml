name: 'Reusable Docker Publish'

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Target image name (e.g. "ghcr.io/thesanketkale/my-service")'
        type: string
        required: true
      registry:
        description: 'Container registry host'
        type: string
        required: false
        default: 'ghcr.io'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        required: false
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        required: false
        default: '.'
      push:
        description: 'Whether to push built image to the registry'
        type: boolean
        required: false
        default: true
      platforms:
        description: 'Target build platforms (comma-separated, e.g. "linux/amd64,linux/arm64")'
        type: string
        required: false
        default: 'linux/amd64'
      tags:
        description: 'Optional custom tags (multiline string)'
        type: string
        required: false
        default: ''
    outputs:
      image-digest:
        description: 'Published image content digest (SHA-256)'
        value: ${{ jobs.build-and-push.outputs.digest }}
      image-tags:
        description: 'Published image tag list'
        value: ${{ jobs.build-and-push.outputs.tags }}

permissions: {}

jobs:
  build-and-push:
    name: 'Build & Publish Container'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup QEMU emulation
        if: contains(inputs.platforms, ',') || contains(inputs.platforms, 'arm')
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Authenticate to Container Registry
        if: inputs.push
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            ${{ inputs.tags }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate build provenance attestation
        if: inputs.push && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarize container publication
        if: always()
        shell: bash
        run: |
          {
            echo "### Container Build Summary"
            echo "- **Image:** \`${{ inputs.image-name }}\`"
            echo "- **Platforms:** \`${{ inputs.platforms }}\`"
            echo "- **Pushed:** \`${{ inputs.push }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
