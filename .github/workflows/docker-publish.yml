name: 'Reusable Docker Publish'

on:
  workflow_call:
    inputs:
      image-name:
        description: 'Target image name (e.g. "ghcr.io/thesanketkale/my-service")'
        type: string
        required: true
      registry:
        description: 'Container registry host'
        type: string
        required: false
        default: 'ghcr.io'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        required: false
        default: 'Dockerfile'
      context:
        description: 'Docker build context path'
        type: string
        required: false
        default: '.'
      push:
        description: 'Whether to push built image to the registry'
        type: boolean
        required: false
        default: true
      platforms:
        description: 'Target build platforms (comma-separated, e.g. "linux/amd64,linux/arm64")'
        type: string
        required: false
        default: 'linux/amd64'
      tags:
        description: 'Optional custom tags (multiline string)'
        type: string
        required: false
        default: ''
    outputs:
      image-digest:
        description: 'Published image content digest (SHA-256)'
        value: ${{ jobs.build-and-push.outputs.digest }}
      image-tags:
        description: 'Published image tag list'
        value: ${{ jobs.build-and-push.outputs.tags }}

permissions: {}

jobs:
  build-and-push:
    name: 'Build & Publish Container'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup QEMU emulation
        if: contains(inputs.platforms, ',') || contains(inputs.platforms, 'arm')
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Authenticate to Container Registry
        if: inputs.push
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ${{ inputs.registry }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract Docker metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ${{ inputs.image-name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            ${{ inputs.tags }}

      - name: Build and push container image
        id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.dockerfile }}
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Generate build provenance attestation
        if: inputs.push && steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: ${{ inputs.image-name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Summarize container publication
        if: always()
        shell: bash
        run: |
          {
            echo "### Container Build Summary"
            echo "- **Image:** \`${{ inputs.image-name }}\`"
            echo "- **Platforms:** \`${{ inputs.platforms }}\`"
            echo "- **Pushed:** \`${{ inputs.push }}\`"
            echo "- **Digest:** \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
