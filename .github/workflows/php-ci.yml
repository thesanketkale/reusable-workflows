name: 'Reusable PHP CI'

on:
  workflow_call:
    inputs:
      working-directory:
        description: 'Working directory containing composer.json'
        type: string
        required: false
        default: '.'
      extensions:
        description: 'Comma-separated list of PHP extensions to install'
        type: string
        required: false
        default: 'mbstring, xml, ctype, pdo, pdo_sqlite'

permissions: {}

jobs:
  matrix-ci:
    name: 'PHP ${{ matrix.php-version }} CI'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP environment
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php-version }}
          extensions: ${{ inputs.extensions }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json strictly
        shell: bash
        run: |
          composer validate --strict

      - name: Cache Composer dependencies
        id: composer-cache
        shell: bash
        run: |
          echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        shell: bash
        run: |
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPStan static analysis
        shell: bash
        run: |
          if [ -f "vendor/bin/phpstan" ] || command -v phpstan >/dev/null 2>&1; then
            echo "Running PHPStan..."
            ./vendor/bin/phpstan analyse --no-progress || phpstan analyse --no-progress
          else
            echo "PHPStan not configured. Skipping."
          fi

      - name: Run PHPUnit test suite
        shell: bash
        run: |
          if [ -f "vendor/bin/phpunit" ] || command -v phpunit >/dev/null 2>&1; then
            echo "Running PHPUnit..."
            ./vendor/bin/phpunit --colors=always || phpunit --colors=always
          else
            echo "PHPUnit not configured. Skipping."
          fi

      - name: Run Composer security audit
        shell: bash
        run: |
          composer audit

      - name: Summarize PHP CI execution
        if: always()
        shell: bash
        run: |
          {
            echo "### PHP CI Summary (PHP ${{ matrix.php-version }})"
            echo "- **PHP Version:** \`${{ matrix.php-version }}\`"
            echo "- **Extensions:** \`${{ inputs.extensions }}\`"
            echo "- **Working Directory:** \`${{ inputs.working-directory }}\`"
            echo "- **Status:** Completed validation, install, analysis, test, and audit."
          } >> "$GITHUB_STEP_SUMMARY"
